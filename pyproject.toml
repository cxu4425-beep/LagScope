[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagscope"
dynamic = ["version"]
description = "Network monitor for the status bar or an overlay: latency, packet loss, upload/download speed and data usage, a speed test with a bufferbloat grade, and a diagnosis of whose fault a stutter is. Deep Bilibili live/video support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["network monitor", "latency", "ping", "packet loss", "speed test", "bufferbloat", "data usage", "overlay", "gaming", "bilibili", "延迟", "网速", "流量"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PySide6-Essentials>=6.5,<7",
    "requests>=2.28",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/cxu4425-beep/LagScope"
Issues = "https://github.com/cxu4425-beep/LagScope/issues"

[project.scripts]
lagscope = "lagscope.cli:main"

[project.gui-scripts]
lagscope-gui = "lagscope.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lagscope.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
